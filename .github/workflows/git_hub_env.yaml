name: github-environment-variable

on:
  push:
  workflow_dispatch: 

jobs:
  test-environment:
    runs-on: ubuntu-latest
    
    # Optional: Practice environments later by uncommenting this
    # environment: production

    steps:
      - name: Say Hello
        run: echo "Hello from my practice!"

      - name: Test printing a fake variable
        env:
          MY_FAKE_VAR: "variable value"
        run: |
          echo "The variable value is: $MY_FAKE_VAR"
          echo "Current date: $(date)"  
