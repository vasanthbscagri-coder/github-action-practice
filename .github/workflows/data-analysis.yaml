name: Python Data Analysis Pipeline

# Define when this workflow should run
on:
  push:
    branches: [ "dev" ]
  # pull_request:
  #   branches: [ "dev" ]
  # Optional: Run automatically every Monday morning at midnight UTC
  # schedule:
  #   - cron: '0 0 * * 1'

jobs:
  run-analysis:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out your repository code into the runner
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Caches dependencies to speed up future runs

    # 3. Install project dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy matplotlib seaborn
        # If you have a requirements.txt file, use this instead:
        # if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 4. Run your data analysis script
    - name: Execute analysis script
      run: |
        python data-analysis.py

    # 5. Save the generated chart/output as a downloadable artifact
    - name: Upload analysis output artifact
      uses: actions/upload-artifact@v4
      with:
        name: price-trend-report
        path: price_trend_analysis.png